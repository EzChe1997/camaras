<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Cámaras</title>
<link rel="manifest" href="manifest.json?v=3">
<link rel="icon" href="icono-192.png">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #000; color: #fff; overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent; user-select: none; }

  #grilla { height: 100dvh; display: flex; flex-direction: column;
    justify-content: center; gap: 4px; padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  @media (orientation: landscape) { #grilla { flex-direction: row; align-items: center; } }

  .cam { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #111; cursor: pointer; }
  @media (orientation: landscape) { .cam { width: auto; flex: 1 1 0; max-height: 100dvh; } }
  cam-player { display: block; width: 100%; height: 100%; }
  /* Stream principal: encima del substream, invisible hasta que tiene imagen */
  cam-player.hd { position: absolute; inset: 0; visibility: hidden; }
  .cam.hd-listo cam-player.hd { visibility: visible; }
  /* El DVR manda 1080N (944x1080) y CIF (352x240): imagen aplastada que se estira a 16:9 */
  .cam video { width: 100%; height: 100%; object-fit: fill; display: block; background: #000; }

  /* Vista ampliada: la camara tocada ocupa todo lo posible en 16:9, la otra se oculta */
  #grilla.ampliada { padding: 0; align-items: center; justify-content: center; }
  #grilla.ampliada .cam { display: none; }
  #grilla.ampliada .cam.activa { display: block; flex: none; aspect-ratio: 16 / 9;
    width: min(100vw, calc(100dvh * 16 / 9)); height: auto; max-height: 100dvh; }

  .rotulo { position: absolute; top: 8px; left: 10px; display: flex; align-items: center; gap: 7px;
    font-size: 15px; font-weight: 600; text-shadow: 0 1px 3px #000; pointer-events: none; }
  .punto { width: 9px; height: 9px; border-radius: 50%; background: #e5484d; box-shadow: 0 0 0 2px #0008; }
  .cam.ok .punto { background: #30a46c; }

  .estado { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 16px; color: #ddd; background: #0009; pointer-events: none; }
  .cam.ok .estado { display: none; }

  #aviso { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    background: #b42318; color: #fff; font-size: 15px; text-align: center; display: none; z-index: 10; }
  #aviso.visible { display: block; }

  #accesos { position: fixed; right: 14px; bottom: calc(14px + env(safe-area-inset-bottom)); z-index: 5; display: flex; gap: 8px; }
  #accesos a { display: flex; align-items: center; gap: 7px; padding: 9px 14px; border-radius: 999px;
    background: #1a1a1aee; border: 1px solid #333; color: #eee; font-size: 14px; text-decoration: none; }
  #accesos a:active { background: #333; }
  #accesos .rec::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: #e5484d; }
  #grilla.ampliada ~ #accesos { display: none; }
</style>
</head>
<body>
<main id="grilla"></main>
<nav id="accesos"><a href="avisos.html">🔔 Avisos</a><a class="rec" href="grabaciones.html">Grabaciones</a></nav>
<div id="aviso">Sin conexión con casa</div>
<script type="module" src="app.js?v=8"></script>
<script>if ('serviceWorker' in navigator && isSecureContext) navigator.serviceWorker.register('sw.js').catch(() => {});</script>
</body>
</html>
